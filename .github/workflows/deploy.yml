name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Daily rebuild so GitHub star counts stay current
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish dist/ to the gh-pages branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages -d dist -t --nojekyll --cname skoruba.com \
            -u "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
